    "shellingham>=1.5.0",
    "six>=1.17.0",
    "sniffio>=1.3.0",
    "SQLAlchemy>=2.0.30",
    "starlette>=0.37.0",
    "StrEnum>=0.4.0",
    "tenacity>=9.1.0",
    "tqdm>=4.68.0",
    "typer>=0.26.0",
    "typing_extensions>=4.16.0",
