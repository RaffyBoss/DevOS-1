    "httpx>=0.27.0",
    "idna>=3.18.0",
    "iniconfig>=2.3.0",
    "Jinja2>=3.1.0",
    "markdown-it-py>=4.2.0",
    "MarkupSafe>=3.0.0",
    "mdurl>=0.1.2",
    "multidict>=6.7.0",
    "numpy>=2.5.0",
    "oauthlib>=3.3.0",
    "orjson>=3.11.0",
    "packaging>=26.0.0",
    "pluggy>=1.6.0",
    "pydantic>=2.7.0",
