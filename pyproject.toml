    "annotated-types>=0.7.0",
    "anyio>=4.14.0",
    "APScheduler>=3.10.0",
    "asgiref>=3.11.0",
    "attrs>=26.0.0",
    "backoff>=2.2.0",
    "bcrypt>=4.1.0",
    "certifi>=2026.0.0",
    "cffi>=2.1.0",
    "charset-normalizer>=3.4.0",
    "click>=8.4.0",
    "cryptography>=42.0.0",
    "deprecation>=2.1.0",
    "distro>=1.9.0",
    "dnspython>=2.8.0",
    "durationpy>=0.10.0",
